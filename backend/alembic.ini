# Alembic configuration for TenantMind
# ============================================================
# Database migrations. PMP §22 Phase 1 deliverable "Database layer";
# §23 technology stack (Alembic for schema migrations).
#
# IMPORTANT — no credentials in this file
# ---------------------------------------
# `sqlalchemy.url` is intentionally left EMPTY. The DSN is resolved at
# runtime by alembic/env.py from app.core.config.settings, which is the
# single source of environment configuration for the whole application.
#
# Alembic is invoked from the backend/ directory:
#
#     ../.venv/bin/alembic upgrade head
#     ../.venv/bin/alembic revision --autogenerate -m "create tenants"
#     ../.venv/bin/alembic current
#
# Requires a reachable PostgreSQL instance. See .env.example.

[alembic]
# Left blank on purpose — see the note above. env.py fills this in from
# Settings.database_url. Do not put a DSN here: this file is committed.
sqlalchemy.url =

# Migrations live beside the application, and the path is resolved
# relative to this file, so commands work from any directory.
script_location = %(here)s/alembic

# Timestamped, sortable, collision-resistant revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use a schema-less naming scheme: TenantMind is multi-tenant, and Phase 2
# decides tenant isolation at the row level (tenant_id + RLS-style filters),
# not by putting each tenant in its own PostgreSQL schema. That decision
# belongs to Phase 2, so nothing is assumed here.
# version_path_separator = os

# Timestamped, and left in the output so migration history is traceable.
[post_write_hooks]

# Logging -----------------------------------------------------------------
# Alembic's own logger. Level is set here; the handler configuration is
# left to the application logger in a later phase, because Phase 1 has no
# logging setup (PMP §22 places logging middleware in a later step).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
